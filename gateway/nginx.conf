# TechHaven gateway: the single public entry point (reverse proxy + load balancer).
#   /api/*        -> api replicas      (round-robin)
#   /api/assistant/* -> assistant (AI chatbot)
#   /socket.io/*  -> realtime replicas (WebSocket upgrade)
#   /*            -> frontend          (static React build)
worker_processes auto;

events { worker_connections 1024; }

http {
  # Docker's embedded DNS. Short TTL so replicas added with
  # "docker compose up -d --scale api=5" join the rotation automatically.
  resolver 127.0.0.11 valid=5s ipv6=off;

  log_format upstreamlog '$remote_addr "$request" $status -> $upstream_addr ($request_time s)';
  access_log /dev/stdout upstreamlog;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    client_max_body_size 20m;   # admin uploads up to 6 images of 3 MB

    set $api_upstream      api:3000;
    set $realtime_upstream realtime:4000;
    set $frontend_upstream frontend:80;
    set $assistant_upstream assistant:4200;

    # AI shopping assistant (separate microservice).
    location /api/assistant/ {
      proxy_pass http://$assistant_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
    }

    # SEO files generated by the API.
    location = /robots.txt { proxy_pass http://$api_upstream/api/seo/robots.txt; }
    location = /sitemap.xml { proxy_pass http://$api_upstream/api/seo/sitemap.xml; }

    location /api/ {
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Fail over quickly to another replica if one is down or restarting.
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
      add_header X-Upstream $upstream_addr always;
    }

    location /socket.io/ {
      proxy_pass http://$realtime_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://$frontend_upstream;
      proxy_set_header Host $host;
    }
  }
}
